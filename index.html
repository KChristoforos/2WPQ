<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Unity Web Player | Psycho Quest</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">

    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #unity-container {
        position: relative !important;
        width: min(100vw, 56.25vh) !important;
        height: min(100vh, 177.7777778vw) !important;
        aspect-ratio: 9 / 16;
        max-width: 1080px;
        max-height: 1920px;
        margin: 0 auto;
        overflow: hidden;
        background: #000;
        left: auto !important;
        top: auto !important;
        transform: none !important;
      }

      #unity-canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        max-width: 100% !important;
        max-height: 100% !important;
        background: #000;
      }

      #unity-loading-bar,
      #unity-warning {
        position: absolute;
        left: 0;
        right: 0;
      }

      /* On phones, use the maximum available viewport while preserving 9:16. */
      @media (max-width: 767px) {
        #unity-container {
          width: min(100vw, 56.25dvh) !important;
          height: min(100dvh, 177.7777778vw) !important;
        }
      }

      /* On tablets/desktops, keep the portrait app centered and contained. */
      @media (min-width: 768px) {
        body {
          padding: 16px;
          box-sizing: border-box;
        }

        #unity-container {
          width: min(calc(100vw - 32px), calc((100vh - 32px) * 0.5625), 1080px) !important;
          height: auto !important;
          max-height: calc(100vh - 32px);
        }

        #unity-canvas {
          aspect-ratio: 9 / 16;
        }
      }
    </style>

  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=1080 height=1920 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/22WEBAPP06092026.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/22WEBAPP06092026.data.unityweb",
        frameworkUrl: buildUrl + "/22WEBAPP06092026.framework.js.unityweb",
        codeUrl: buildUrl + "/22WEBAPP06092026.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Psycho Quest",
        productVersion: "21",
        showBanner: unityShowBanner,
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
