<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Unity Web Player | Psycho Quest</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#000000">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=1080 height=1920 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/22WEBAPP06092026.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/22WEBAPP06092026.data.unityweb",
        frameworkUrl: buildUrl + "/22WEBAPP06092026.framework.js.unityweb",
        codeUrl: buildUrl + "/22WEBAPP06092026.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Psycho Quest",
        productVersion: "21",
        showBanner: unityShowBanner,
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;


      function resizeUnityContainer() {
        const viewport = window.visualViewport;
        const vw = viewport ? viewport.width : window.innerWidth;
        const vh = viewport ? viewport.height : window.innerHeight;

        const targetRatio = 9 / 16;
        const viewportRatio = vw / vh;

        let width, height;

        if (viewportRatio > targetRatio) {
          // Viewport is wider than 9:16: fit by height.
          height = vh;
          width = height * targetRatio;
        } else {
          // Viewport is narrower/taller than 9:16: fit by width.
          width = vw;
          height = width / targetRatio;
        }

        // Desktop/tablet: leave a small breathing room around the portrait app.
        const isDesktopLike = vw >= 768;
        if (isDesktopLike) {
          const maxHeight = Math.max(0, vh - 24);
          const maxWidth = Math.max(0, vw - 24);

          height = Math.min(height, maxHeight, 1920);
          width = height * targetRatio;

          if (width > maxWidth) {
            width = Math.min(maxWidth, 1080);
            height = width / targetRatio;
          }
        }

        container.style.width = Math.floor(width) + "px";
        container.style.height = Math.floor(height) + "px";
      }

      resizeUnityContainer();
      window.addEventListener("resize", resizeUnityContainer);
      window.addEventListener("orientationchange", function () {
        setTimeout(resizeUnityContainer, 150);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", resizeUnityContainer);
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
